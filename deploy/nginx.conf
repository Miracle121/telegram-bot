# nginx konfiguratsiyasi — /etc/nginx/sites-available/telegram-bot ga ko'chiriladi.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/telegram-bot
#   sudo ln -s /etc/nginx/sites-available/telegram-bot /etc/nginx/sites-enabled/
#   # bot.example.com ni o'z domeningizga almashtiring
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bot.example.com
#
# certbot ishga tushgach 443 bloki va sertifikat qatorlarini o'zi qo'shadi.

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    # Let's Encrypt tekshiruvi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.example.com;

    # Bu qatorlarni certbot o'zi to'ldiradi:
    # ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    # Telegram update'lari 1 MB dan oshmaydi
    client_max_body_size 1m;

    access_log /var/log/nginx/telegram-bot.access.log;
    error_log  /var/log/nginx/telegram-bot.error.log;

    # Faqat webhook va health ochiq — qolgan yo'llar tashqariga chiqarilmaydi
    location /webhook/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
