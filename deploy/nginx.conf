# nginx konfiguratsiyasi — /etc/nginx/sites-available/telegram-bot ga ko'chiriladi.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/telegram-bot
#   sudo sed -i 's/bot.example.com/<sizning domeningiz>/' /etc/nginx/sites-available/telegram-bot
#   sudo ln -sf /etc/nginx/sites-available/telegram-bot /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Bu fayl ataylab faqat HTTP (80-port) bilan keladi: sertifikat hali yo'q paytda
# `listen 443 ssl` yozilsa nginx umuman ishga tushmaydi. HTTPS blokini va
# 80 -> 443 yo'naltirishni certbot o'zi qo'shadi:
#
#   sudo certbot --nginx -d bot.example.com
#
# Sertifikat olinishidan oldin domenning A-yozuvi shu serverga qaragan bo'lishi shart.

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    # Telegram update'lari 1 MB dan oshmaydi
    client_max_body_size 1m;

    access_log /var/log/nginx/telegram-bot.access.log;
    error_log  /var/log/nginx/telegram-bot.error.log;

    # Let's Encrypt tekshiruvi
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Faqat webhook va health ochiq — qolgan yo'llar tashqariga chiqarilmaydi
    location /webhook/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
