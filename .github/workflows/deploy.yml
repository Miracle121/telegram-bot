name: Deploy

# main ga har push da sinovlar ishlaydi; VPS secret'lari qo'shilgan bo'lsa server yangilanadi.
# Kerakli GitHub Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (ixtiyoriy: VPS_PORT)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Sinovlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm ci --omit=dev

      - name: Sintaksisni tekshirish
        run: |
          for file in bot.js config.js telegram.js i18n.js store.js scripts/*.js; do
            node --check "$file"
          done

      - name: Uchdan-uchgacha sinov
        run: npm test

  deploy:
    name: Serverga chiqarish
    needs: check
    runs-on: ubuntu-latest
    steps:
      # Secret'lar hali qo'shilmagan bo'lsa deploy o'tkazib yuboriladi —
      # workflow behuda qizarmaydi.
      - name: Sozlamalar borligini tekshirish
        id: guard
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VPS_HOST secret topilmadi — deploy o'tkazib yuborildi." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: SSH orqali yangilash
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/telegram-bot

            git fetch --all
            git reset --hard origin/main

            npm ci --omit=dev

            sudo systemctl restart telegram-bot

            # Xizmat haqiqatan ko'tarilganini tekshiramiz
            sleep 3
            systemctl is-active --quiet telegram-bot
            curl -fsS http://127.0.0.1:3000/health
            echo ""
            echo "Deploy muvaffaqiyatli"
